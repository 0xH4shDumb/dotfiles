# ┌──────────────────────────────────────────┐
# │  h4shdumb · kitty                       │
# └──────────────────────────────────────────┘

# ─── Font ───
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0
disable_ligatures never

# ─── Window ───
background_opacity 0.15
dynamic_background_opacity yes
window_padding_width 14 16
confirm_os_window_close 0
hide_window_decorations yes
placement_strategy center
remember_window_size yes
initial_window_width  120c
initial_window_height 35c
resize_in_steps yes

# ─── Cursor ───
cursor_shape underline
cursor_underline_thickness 2
cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# ─── Scrollback ───
scrollback_lines 20000
wheel_scroll_multiplier 3.0

# ─── Mouse ───
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
url_color #ff66cc
url_style curly
open_url_with default
detect_urls yes

# ─── Bell ───
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

# ─── Shell ───
shell fish

# ─── Tab bar ───
tab_bar_edge top
tab_bar_style custom
tab_bar_min_tabs 2
tab_activity_symbol " "
tab_title_max_length 20
tab_title_template " {index}: {title} "
active_tab_title_template " {index}: {title} "

active_tab_foreground   #1a1a1f
active_tab_background   #ff66cc
active_tab_font_style   bold
inactive_tab_foreground #8a8490
inactive_tab_background #1a1a1f
inactive_tab_font_style normal
tab_bar_background      #0d0d0f
tab_bar_margin_color    #0d0d0f

# ─── Colors · h4shdumb palette ───
foreground #e8dfeb
background #000000

selection_foreground #1a1a1f
selection_background #5c5560

# black
color0  #1a1a1f
color8  #5c5560

# red
color1  #ff2e63
color9  #ff6b8f

# green
color2  #8ce8a0
color10 #a8f5b8

# yellow
color3  #ffcb6b
color11 #ffdb94

# blue
color4  #7d9fff
color12 #a3c1ff

# magenta
color5  #ff66cc
color13 #c77dff

# cyan
color6  #7deaff
color14 #a0f0ff

# white
color7  #d8cfdc
color15 #f5eef8

# ─── Splits ───
active_border_color #ff66cc
inactive_border_color #3f3a40
window_border_width 1px
draw_minimal_borders yes
window_margin_width 2

# ─── Advanced ───
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}
term xterm-256color

# ─── Layouts ───
enabled_layouts splits,stack

# ─── Keybindings ───
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd

# Splits (style Terminator)
map ctrl+shift+o launch --type=background /home/h4shdumb/.local/bin/kitty-smart-split hsplit
map ctrl+shift+e launch --type=background /home/h4shdumb/.local/bin/kitty-smart-split vsplit
map ctrl+shift+w close_window

# Navigation splits
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Resize splits
map ctrl+alt+left resize_window narrower 4
map ctrl+alt+right resize_window wider 4
map ctrl+alt+up resize_window taller 2
map ctrl+alt+down resize_window shorter 2

# Zoom split (toggle fullscreen d'un seul split)
map ctrl+shift+z toggle_layout stack

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward

# AZERTY : &é"'(-è_ç = 1-9
map ctrl+shift+ampersand goto_tab 1
map ctrl+shift+eacute goto_tab 2
map ctrl+shift+quotedbl goto_tab 3
map ctrl+shift+apostrophe goto_tab 4
map ctrl+shift+parenleft goto_tab 5
map ctrl+shift+minus goto_tab 6
map ctrl+shift+egrave goto_tab 7
map ctrl+shift+underscore goto_tab 8
map ctrl+shift+ccedilla goto_tab 9

# Fallback number keys (Shift flips AZERTY to digits)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

map ctrl+shift+f5 load_config_file
# fullscreen geré par niri (Mod+F), pas kitty
map ctrl+shift+f11 no_op

map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
